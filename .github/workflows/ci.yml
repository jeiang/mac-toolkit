name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # caffeinate, the duck property and the event tap are macOS's; so is
    # the app.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Format
        run: nix develop -c zig fmt --check build.zig src tools
      - name: Test
        run: nix develop -c zig build test --summary all
      - name: App bundle
        run: nix develop -c zig build app
      - name: Flake checks (package and format)
        run: nix flake check -L
